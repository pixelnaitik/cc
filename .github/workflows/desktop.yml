name: Desktop

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run test
      - run: npm run desktop:build-renderer
      - run: npm run desktop:bundle-main
      - run: node scripts/check-desktop-assets.mjs
      - run: npx playwright install chromium
      - run: npm run test:e2e:desktop
      - run: npm run desktop:msi:test
        env:
          PM_ARTIFACT_SUFFIX: '-unsigned-test'
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-desktop-test
          path: release-desktop/*-unsigned-test.msi
          if-no-files-found: error
